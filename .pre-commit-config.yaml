repos:
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v18.1.8
    hooks:
      - id: clang-format
        args: [--style=file, -i]
        types_or: [c++, c, cuda, objective-c++]

  - repo: https://github.com/google/yapf
    rev: v0.43.0  # Use the latest version tag
    hooks:
      - id: yapf
        args: [--style, .style.yapf, --in-place]
